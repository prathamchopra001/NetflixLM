name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NIP_CI: "1"  # tests/conftest.py: a skipped test fails (no silent "green, never ran")
    services:
      # The schema-drift test and the store integration tests (R15).
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_USER: nip
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nip
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      # TorchCodec decodes through the system FFmpeg libraries; the media, shot and walking-skeleton
      # tests need ffmpeg/ffprobe on PATH.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: df -h / && ffmpeg -version | head -1
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: df -h /  # the CUDA torch wheel set is several GB (1.1 M6)
      - run: uv run pytest -m "not gpu and not integration"
        env:
          NIP_PROFILE: cpu
      # Store tests that need only Postgres (+ ffmpeg); no GPU, Docker, S3 or corpus media.
      # test_real_embedder_ranks downloads a 1.2 GB model (NIP_INDEX_REAL), so it stays local.
      - run: >-
          uv run pytest -m integration
          tests/integration/test_migrations_pg.py tests/integration/test_store.py
          tests/integration/test_asr_persist.py tests/integration/test_cue_align_pg.py
          tests/integration/test_index_pg.py tests/integration/test_knowledge.py
          tests/integration/test_layer1.py tests/integration/test_layer1_oracle.py
          tests/integration/test_ocr_detections_pg.py tests/integration/test_story_pg.py
          --deselect tests/integration/test_index_pg.py::test_real_embedder_ranks
        env:
          NIP_PROFILE: cpu
          NIP_TEST_DATABASE_URL: postgresql://nip:ci@localhost:5432/nip
