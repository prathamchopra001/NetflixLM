name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NIP_CI: "1"  # tests/conftest.py: a skipped test fails (no silent "green, never ran")
    services:
      # Only for the schema-drift test (migration vs nip.store.schema).
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_USER: nip
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nip
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      # TorchCodec decodes through the system FFmpeg libraries; the media, shot and walking-skeleton
      # tests need ffmpeg/ffprobe on PATH.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: df -h / && ffmpeg -version | head -1
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: df -h /  # the CUDA torch wheel set is several GB (1.1 M6)
      - run: uv run pytest -m "not gpu and not integration"
        env:
          NIP_PROFILE: cpu
      - run: uv run pytest -m integration tests/integration/test_migrations_pg.py
        env:
          NIP_TEST_DATABASE_URL: postgresql://nip:ci@localhost:5432/nip
