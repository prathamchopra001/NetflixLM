# Model catalog: for each slot, variants ranked by quality_rank (higher is better within a slot).
# Spec: docs/hardware-adaptation.md › Model Catalog; defaults: docs/tech-stack.md › Model Catalog Defaults.
#
# Units: every *_gb is GiB (2**30 bytes), the unit the probe reports free VRAM in.
# Sources of the numbers (2026-10-15):
#   weights_gb           tech-stack.md checkpoint sizes (vllm variants)
#   kv_mb_per_1k_tokens  hardware-adaptation.md where it gives one (qwen3.5-4b, qwen3.8-27b);
#                        otherwise hf-mem 0.5.6 on the base model (bf16 KV, max_model_len=1024)
#   vram_gb (actors)     tech-stack.md for whisper; otherwise hf-mem weights + 0.5 GiB
#                        activations (estimate), or a plain estimate where hf-mem can't read the
#                        repo (PaddleOCR, TransNetV2 are not safetensors repos)
#   overhead_gb          starting estimates (qwen3.5-4b-awq: measured, EXP-001)
#   startup_peak_gb      optional: per-GPU peak while the engine starts, before its KV cache exists
# Estimates are replaced by measured peaks after a variant's first load (variant_calibration).
# A new variant may omit weights_gb / kv_mb_per_1k_tokens / vram_gb: the loader asks hf-mem.

variants:
  # ── text_llm + vlm: Qwen, natively multimodal (one deployment serves both slots) ──
  - id: qwen3.5-4b-awq
    serves: [text_llm, vlm]
    family: qwen
    engine: vllm
    base_model: Qwen/Qwen3.5-4B
    checkpoint: cyankiwi/Qwen3.5-4B-AWQ-4bit  # compressed-tensors W4A16 g32, 3.78 GiB (no official AWQ)
    quant: awq-int4
    weights_gb: 4.0
    # Measured, EXP-001 (RTX 4060 Laptop, vLLM 0.30, 8k, enforce-eager, 2 images x 589,824 px):
    overhead_gb: 0.53        # steady non-KV 4.53 GiB = NVML peak - vLLM KV, max over gmu 0.80-0.86
    kv_mb_per_1k_tokens: 45.8  # MiB per 1,024 tok: 1.56 GiB / 35,746 tok = 45.76 (gmu 0.75), 0.94 GiB / 21,597 = 45.64 (exact KV)
    startup_peak_gb: 6.25    # NVML peak before KV allocation: 6,397-6,400 MiB at KV 0.94 and 1.56 GiB
    context: {default: 32768, min: 8192}
    tp_options: [1]
    min_vllm: "0.30"
    box_format: xyxy_0_1000
    max_pixels: 589824     # ~1024x576; vlm defaults until Phase 3 tuning
    images_per_prompt: 2
    quality_rank: 30
    cost_hint: 1.0
    license: Apache-2.0

