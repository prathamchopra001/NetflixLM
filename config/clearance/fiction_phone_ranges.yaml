# Fiction-reserved telephone numbers: never clearance candidates (architecture.md > Agent 2,
# D-026). Per region, anchored regexes (re.fullmatch) over the national significant number that
# libphonenumber parses out of the detected text, so "(212) 555-0142", "212.555.0142" and
# "+1 212 555 0142" all reduce to 2125550142.
# A region with no list has no reserved range configured: every number there is a candidate.
NANP:                      # US, CA: 555-0100 to 555-0199 under any area code; the other 555 lines
  regions: [US, CA]        # were returned to general use in 2016, so 555-0200.. stay candidates
  national: ['\d{3}55501\d{2}']
GB:                        # Ofcom drama ranges (ofcom.org.uk, "numbers for use in TV and radio drama")
  regions: [GB]
  national:
    - '7700900\d{3}'       # 07700 900000-900999 mobile
    - '1632960\d{3}'       # 01632 960000-960999
    - '2079460\d{3}'       # 020 7946 0000-0999 London
    - '1914980\d{3}'       # 0191 498 0000-0999 Tyneside
    - '3069990\d{3}'       # 03069 990000-990999
    - '8081570\d{3}'       # 0808 157 0000-0999 freephone
    - '9098790\d{3}'       # 0909 879 0000-0999 premium rate
# ES, DE, FR: no reserved range configured yet (add under its own key when legal supplies one).
