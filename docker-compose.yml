services:
  # === LLM Inference (CPU/GPU-flexible) ===
  vllm-llama8b:
    image: vllm/vllm-openai:latest
    platform: linux/amd64
    # CPU fallback: swap to ubuntu + python + huggingface transformers if no GPU available.
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              # Set count: 0 if you have no GPU and want CPU-only fallback
              count: all
    volumes:
      - llama8b-models:/models
    environment:
      - MODEL_NAME=meta-llama/Llama-3.1-8B-Instruct
    # command measured at docker-compose runtime; keep default as-is for now
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nip-net

  vllm-qwen2vl:
    image: vllm/vllm-openai:latest
    platform: linux/amd64
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              count: all
    volumes:
      - qwen2vl-models:/models
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nip-net

  # === Data Stores ===
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-netflix_nip_password}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nip-net

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nip-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin_password_123}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nip-net

  # === Orchestration (Apache Airflow for now; lighter than Dagster for MVP) ===
  airflow-postgres:
    image: postgres:15
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    networks:
      - nip-net

  airflow-webserver:
    image: apache/airflow:2.8
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__BASE_LOG_FOLDER: /opt/airflow/logs
    volumes:
      - ./pipeline/orchestrator/dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/dags/nip_pipeline
      - airflow-logs:/opt/airflow/logs
    ports:
      - "8081:8080"
    depends_on:
      airflow-postgres:
        condition: service_started
    networks:
      - nip-net

  airflow-scheduler:
    image: apache/airflow:2.8
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    volumes:
      - ./pipeline/orchestrator/dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/dags/nip_pipeline
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-postgres:
        condition: service_started
    networks:
      - nip-net

  # === API ===
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-netflix_nip_password}
      - QDRANT_URL=http://qdrant:6333
      - LLM_URL=http://vllm-llama8b:8002/v1
      - VLM_URL=http://vllm-qwen2vl:8001/v1
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - nip-net

  # === Monitoring ===
  prometheus:
    image: prom/prometheus:v2.48
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - nip-net

  grafana:
    image: grafana/grafana:10.3
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - nip-net

volumes:
  neo4j-data:
  qdrant-data:
  minio-data:
  llama8b-models:
  qwen2vl-models:
  airflow-postgres-data:
  airflow-logs:
  prometheus-data:
  grafana-data:

networks:
  nip-net:
    driver: bridge
