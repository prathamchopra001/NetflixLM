groups:
  - name: nip_alerts
    rules:
      - alert: NIPAgentLatencyHigh
        expr: histogram_quantile(0.95, rate(nip_agent_latency_seconds_bucket[5m])) > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NIP agent P95 latency exceeds 600s"
          description: "95th percentile agent latency is {{ $value }}s, exceeding the 600s threshold."

      - alert: NIPConstraintViolationsSpike
        expr: increase(nip_kg_constraints_violated_total[1h]) > 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Spike in KG constraint violations"
          description: "{{ $value }} constraint violations in the last hour, exceeding threshold of 10."

      - alert: NIPGPUMemoryHigh
        expr: nip_gpu_utilization_percent > 95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU utilization above 95%"
          description: "GPU {{ $labels.gpu_id }} utilization is {{ $value }}%."

      - alert: NIPPipelineTimeout
        expr: nip_episode_processing_duration_seconds > 2700
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Episode processing exceeded 45-minute timeout"
          description: "Episode processing duration is {{ $value }}s, exceeding 2700s timeout."

      - alert: NIPRecapSpoilerRisk
        expr: nip_recap_spoiler_risk_score > 0.4
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Recap spoiler risk score above threshold"
          description: "Recap spoiler risk score is {{ $value }}, exceeding 0.4 block threshold."
