global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nip-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8080

  - job_name: nip-vllm-llama70b
    metrics_path: /metrics
    static_configs:
      - targets:
          - vllm-llama70b:8000

  - job_name: nip-vllm-qwen2vl
    metrics_path: /metrics
    static_configs:
      - targets:
          - vllm-qwen2vl:8001

  - job_name: nip-vllm-llama8b
    metrics_path: /metrics
    static_configs:
      - targets:
          - vllm-llama8b:8002

  - job_name: nip-neo4j
    static_configs:
      - targets:
          - neo4j:7474

  - job_name: nip-qdrant
    static_configs:
      - targets:
          - qdrant:6333

rule_files:
  - alert_rules.yml
Transform: AWS::Serverless-2016-10-31