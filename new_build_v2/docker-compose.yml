version: '3.8'

services:
  # Knowledge Graph
  neo4j:
    image: neo4j:5-community
    ports: 
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/netflix_lm_secure
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

  # Vector Index
  qdrant:
    image: qdrant/qdrant:latest
    ports: 
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  # Object Storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports: 
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: netflix_lm_secure
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # Multi-Agent API Orchestrator
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    ports: 
      - "8080:8080"
    depends_on:
      - neo4j
      - qdrant
      - minio
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=netflix_lm_secure
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=netflix_lm_secure
    restart: unless-stopped

volumes:
  neo4j-data:
  qdrant-data:
  minio-data:
