agent: recap_agent
variants:
  - tone: action
    description: "Action-focused recap"
  - tone: romance
    description: "Romance-focused recap"
  - tone: suspense
    description: "Suspense-focused recap"
  - tone: comedy
    description: "Comedy-focused recap"
  - tone: character_study
    description: "Character study recap"
prompts:
  base_recap: "Generate a structured recap of this episode based on the scene graph nodes..."
  variant_template: "Rewrite this recap with a {tone} focus, emphasizing {thread_focus}..."
spoiler_control:
  episodic_mode: true
  risk_block_threshold: 0.40
