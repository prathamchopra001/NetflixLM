agent: script_critic
layers:
  graph_traversal:
    enabled: true
    description: "KG constraint queries for factual contradictions"
  rac_retrieval:
    enabled: true
    description: "RAC context windows for motivational/emotional gaps"
  bdi_simulation:
    enabled: false
    description: "BDI character simulation (MVP stretch)"
prompts:
  graph_traversal_summary: "Analyze the following KG constraint violations and summarize plot holes..."
  rac_retrieval_query: "Given this scene context and prior episodes, identify motivational inconsistencies..."
thresholds:
  confidence_auto_escalate: 0.90
  confidence_review_recommended: 0.70
  confidence_suppress: 0.70
